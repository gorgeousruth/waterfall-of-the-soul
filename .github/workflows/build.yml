name: Release sub-5mb App
on: [push]

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js system environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Native Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Create Pristine Tauri Workspace Template
        run: |
          npx create-tauri-app@latest tauri-core --y -- --project-name "waterfall-app" --template vanilla --package-manager npm --frontend-dist "../dist-app"

      - name: Inject Your Existing Web Code Files
        shell: cmd
        run: |
          mkdir dist-app
          if exist index.html copy index.html dist-app\
          if exist style.css copy style.css dist-app\
          if exist script.js copy script.js dist-app\

      - name: Configure Micro Optimization Settings
        shell: cmd
        run: |
          echo. >> tauri-core\src-tauri\Cargo.toml
          echo [profile.release]>> tauri-core\src-tauri\Cargo.toml
          echo opt-level = "z">> tauri-core\src-tauri\Cargo.toml
          echo lto = true>> tauri-core\src-tauri\Cargo.toml
          echo codegen-units = 1>> tauri-core\src-tauri\Cargo.toml
          echo panic = "abort">> tauri-core\src-tauri\Cargo.toml
          echo strip = true>> tauri-core\src-tauri\Cargo.toml

      - name: Install Dependencies
        run: |
          cd tauri-core
          npm install

      - name: Compile and Compress Executable
        run: |
          cd tauri-core
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Finished Standalone App
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Offline-Executable
          path: tauri-core/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
